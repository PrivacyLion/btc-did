[package]
name = "groth16-verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-snark = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "verify"
path = "src/main.rs"
