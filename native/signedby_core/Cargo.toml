[package]
name = "signedby_core"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }
# JNI for Android
jni = "0.21"
anyhow = "1"

# Cryptographic primitives
sha2 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }

# Arkworks for Groth16 / BN254 operations
ark-ff = "0.4"
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-groth16 = "0.4"
ark-snark = "0.4"
ark-serialize = "0.4"

# Utilities
thiserror = "1.0"
once_cell = "1.18"
libc = "0.2"  # For dlopen/dlsym on Android

# Bitcoin / Schnorr / Taproot
secp256k1 = { version = "0.28", features = ["rand-std", "global-context"] }
bitcoin = { version = "0.31", features = ["rand-std"] }

# Lightning invoice generation
lightning-invoice = "0.29"

# Base64 encoding
base64 = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Note: WASM witness calculation requires either:
# - circom-witnesscalc (needs protoc + clang)
# - wasmer/wasmtime (complex Android support)
# Current approach: Call external witness calculator binary
num-bigint = "0.4"

[features]
default = []

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
