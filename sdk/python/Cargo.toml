[package]
name = "signedby-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for SignedByMe SDK"
license = "MIT"

[lib]
name = "signedby"
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encoding
hex = "0.4"
bech32 = "0.11"
base64 = "0.21"
