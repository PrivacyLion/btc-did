[package]
name = "signedby-napi"
version = "0.1.0"
edition = "2021"
description = "Node.js bindings for SignedByMe SDK"
license = "SSAL-1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs for Node.js bindings
napi = { version = "2", features = ["async", "napi9"] }
napi-derive = "2"

# Core SDK (local path)
signedby_core = { path = "../../../native/signedby_core" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = "z"
