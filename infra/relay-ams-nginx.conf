# SignedByMe NOSTR Relay - AMS (Europe)
# Server: 152.42.133.217
# Deploy: scp infra/relay-ams-nginx.conf root@152.42.133.217:/etc/nginx/sites-available/relay
# Then: certbot --nginx -d relay-ams.signedbyme.com && nginx -t && systemctl reload nginx

server {
    server_name relay-ams.privacy-lion.com relay-ams.signedbyme.com;

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/relay-ams.privacy-lion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay-ams.privacy-lion.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name relay-ams.privacy-lion.com relay-ams.signedbyme.com;
    return 301 https://$host$request_uri;
}
