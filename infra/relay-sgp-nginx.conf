# SignedByMe NOSTR Relay - SGP (Asia)
# Server: 188.166.249.128
# Deploy: scp infra/relay-sgp-nginx.conf root@188.166.249.128:/etc/nginx/sites-available/relay
# Then: certbot --nginx -d relay-sgp.signedbyme.com && nginx -t && systemctl reload nginx

server {
    server_name relay-sgp.privacy-lion.com relay-sgp.signedbyme.com;

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/relay-sgp.signedbyme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay-sgp.signedbyme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name relay-sgp.privacy-lion.com relay-sgp.signedbyme.com;
    return 301 https://$host$request_uri;
}
